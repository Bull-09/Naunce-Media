<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>Forms Admin — Nuance Media</title>
  <style>
    :root{--bg:#080808;--panel:#111;--panel2:#171717;--line:#292929;--text:#f5f3f7;--muted:#aaa4ae;--violet:#8b5cf6;--pink:#d946ef;--green:#5ee6ae;--danger:#ff7b8b;--r:20px}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(circle at 75% 0,#301752 0,transparent 30rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.topbar{height:86px;display:flex;align-items:center;justify-content:space-between}.wordmark,.login-brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:-.035em}.wordmark{font-size:1.2rem}.login-brand{display:inline-block;margin-bottom:25px;font-size:.8rem;letter-spacing:.14em;color:#d6b9ff}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#c4a8ff;font-size:.72rem;font-weight:800}.login-wrap{min-height:calc(100vh - 86px);display:grid;place-items:center;padding:24px 0 80px}.login-card{width:min(460px,100%);padding:clamp(26px,5vw,46px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(25,25,25,.95),rgba(12,12,12,.97));box-shadow:0 30px 100px #0008}.login-card h1{font-size:clamp(2rem,6vw,3rem);line-height:1;margin:8px 0 14px;letter-spacing:-.06em}.login-card p{color:var(--muted);line-height:1.6;margin:0 0 30px}.field{display:grid;gap:9px}.field label{font-weight:750;font-size:.88rem}.field input,.tools input,.tools select{width:100%;border:1px solid var(--line);background:#0c0c0c;color:var(--text);border-radius:13px;padding:14px 15px;outline:none}.field input:focus,.tools input:focus,.tools select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8b5cf626}.primary{width:100%;border:0;border-radius:13px;padding:15px 18px;margin-top:15px;color:white;font-weight:850;background:linear-gradient(110deg,var(--violet),var(--pink));box-shadow:0 14px 30px #8b5cf62c}.primary:disabled{opacity:.6}.error{min-height:22px;margin:10px 0 0;color:var(--danger);font-size:.88rem}.dashboard{display:none;padding:40px 0 70px}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:12px 0 30px}.dash-head h1{margin:6px 0 0;font-size:clamp(2.2rem,5vw,4.5rem);letter-spacing:-.07em;line-height:.95}.ghost{border:1px solid var(--line);background:#131313;color:var(--text);padding:11px 16px;border-radius:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.metric{padding:22px;border:1px solid var(--line);background:linear-gradient(145deg,#171717,#101010);border-radius:var(--r)}.metric span{display:block;color:var(--muted);font-size:.82rem;margin-bottom:12px}.metric strong{font-size:2rem;letter-spacing:-.05em}.tools{display:grid;grid-template-columns:minmax(200px,1fr) 240px;gap:12px;margin-bottom:14px}.table-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0f0f0f}.row{display:grid;grid-template-columns:1.25fr 1fr 1.15fr .8fr 28px;gap:16px;align-items:center;padding:18px 20px;border-bottom:1px solid #222}.row:last-child{border:0}.row.head{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;background:#151515}.submission{transition:.18s}.submission:hover{background:#171717}.submission button{display:contents;color:inherit;text-align:left}.name{font-weight:780}.sub{color:var(--muted);font-size:.81rem;margin-top:4px;overflow-wrap:anywhere}.badge{display:inline-flex;width:max-content;border:1px solid #5a3d8a;color:#d9c8ff;background:#8b5cf619;padding:6px 9px;border-radius:999px;font-size:.75rem;font-weight:750}.arrow{color:#aaa}.empty{text-align:center;padding:70px 20px;color:var(--muted)}dialog{width:min(720px,calc(100% - 24px));max-height:86vh;border:1px solid var(--line);border-radius:24px;background:#111;color:var(--text);padding:0;box-shadow:0 30px 100px #000b}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}.modal-head{position:sticky;top:0;background:#111e;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:22px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.modal-head h2{margin:0;letter-spacing:-.03em}.close{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#191919;color:white}.answers{padding:12px 24px 28px}.answer{padding:17px 0;border-bottom:1px solid #242424}.answer:last-child{border:0}.answer dt{font-size:.77rem;color:#a899b8;margin-bottom:7px}.answer dd{margin:0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}@media(max-width:780px){.metrics{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.row{grid-template-columns:1fr 28px}.row.head{display:none}.row>div:nth-child(2),.row>div:nth-child(3),.row>div:nth-child(4){display:none}.dash-head{align-items:start}}@media(max-width:420px){.metrics{grid-template-columns:1fr}.shell{width:min(100% - 22px,1180px)}}
  </style>
</head>
<body>
  <header class="shell topbar"><a class="wordmark" href="/" aria-label="Nuance Media home">Nuance Media</a><span class="eyebrow">Private workspace</span></header>
  <main class="shell">
    <section class="login-wrap" id="loginView">
      <form class="login-card" id="loginForm"><div class="login-brand">NUANCE MEDIA</div><h1>Forms admin</h1><p>Review every client response from one secure, searchable workspace.</p><div class="field"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"></div><button class="primary" type="submit">Open dashboard</button><div class="error" id="loginError" role="alert"></div></form>
    </section>
    <section class="dashboard" id="dashboard">
      <div class="dash-head"><div><span class="eyebrow">Response centre</span><h1>Form submissions</h1></div><button class="ghost" id="logout">Log out</button></div>
      <div class="metrics"><div class="metric"><span>All responses</span><strong id="mTotal">—</strong></div><div class="metric"><span>Growth audits</span><strong id="mGrowth">—</strong></div><div class="metric"><span>ZebraLearn</span><strong id="mZebra">—</strong></div><div class="metric"><span>Received today</span><strong id="mToday">—</strong></div></div>
      <div class="tools"><input id="search" type="search" placeholder="Search name, brand, email or answer…" aria-label="Search submissions"><select id="filter" aria-label="Filter by form"><option value="all">All forms</option><option value="ecommerce_growth_audit">E-commerce Growth Audit</option><option value="zebralearn_blinkit">ZebraLearn × Blinkit</option></select></div>
      <div class="table-wrap"><div class="row head"><div>Contact / Brand</div><div>Form</div><div>Contact</div><div>Received</div><div></div></div><div id="rows"></div></div>
    </section>
  </main>
  <dialog id="detail"><div class="modal-head"><div><span class="eyebrow" id="detailType"></span><h2 id="detailTitle">Submission</h2></div><button class="close" id="close" aria-label="Close">×</button></div><dl class="answers" id="answers"></dl></dialog>
  <script>
    const $=s=>document.querySelector(s), loginView=$('#loginView'), dashboard=$('#dashboard'), rows=$('#rows'); let data=[];
    const labels={ecommerce_growth_audit:'E-commerce Growth Audit',zebralearn_blinkit:'ZebraLearn × Blinkit'};
    const human=k=>k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).replace(/\bRoas\b/,'ROAS').replace(/\bAov\b/,'AOV').replace(/\bKpi\b/,'KPI');
    const text=v=>Array.isArray(v)?v.join(', '):(v===true?'Yes':v===false?'No':String(v??'—'));
    const primary=s=>s.contact_name||s.answers?.brandName||s.answers?.contactName||'Anonymous response';
    const fmt=d=>new Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d));
    async function load(){const r=await fetch('/api/admin-submissions',{credentials:'same-origin'});if(r.status===401)return showLogin();if(!r.ok){const body=(r.headers.get('content-type')||'').includes('application/json')?await r.json():{};throw Error(body.error||'Could not load responses')}data=(await r.json()).submissions||[];showDashboard();render();}
    function showLogin(){loginView.style.display='grid';dashboard.style.display='none'}function showDashboard(){loginView.style.display='none';dashboard.style.display='block'}
    function render(){const q=$('#search').value.toLowerCase(), f=$('#filter').value;const filtered=data.filter(s=>(f==='all'||s.form_type===f)&&JSON.stringify(s).toLowerCase().includes(q));$('#mTotal').textContent=data.length;$('#mGrowth').textContent=data.filter(s=>s.form_type==='ecommerce_growth_audit').length;$('#mZebra').textContent=data.filter(s=>s.form_type==='zebralearn_blinkit').length;const today=new Date().toDateString();$('#mToday').textContent=data.filter(s=>new Date(s.created_at).toDateString()===today).length;rows.replaceChildren();if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent='No matching submissions yet.';rows.append(e);return}filtered.forEach(s=>{const r=document.createElement('div');r.className='row submission';const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Open submission');const a=document.createElement('div');const n=document.createElement('div');n.className='name';n.textContent=primary(s);const brand=document.createElement('div');brand.className='sub';brand.textContent=s.answers?.brandName||s.answers?.websiteUrl||'';a.append(n,brand);const form=document.createElement('div');const badge=document.createElement('span');badge.className='badge';badge.textContent=labels[s.form_type]||human(s.form_type);form.append(badge);const contact=document.createElement('div');contact.append(Object.assign(document.createElement('div'),{textContent:s.contact_email||s.contact_phone||'—'}));const date=document.createElement('div');date.className='sub';date.textContent=fmt(s.created_at);const arrow=document.createElement('div');arrow.className='arrow';arrow.textContent='›';b.append(a,form,contact,date,arrow);b.onclick=()=>openDetail(s);r.append(b);rows.append(r)})}
    function openDetail(s){$('#detailType').textContent=labels[s.form_type]||human(s.form_type);$('#detailTitle').textContent=primary(s);const box=$('#answers');box.replaceChildren();Object.entries(s.answers||{}).filter(([k])=>!['company','website'].includes(k)).forEach(([k,v])=>{const wrap=document.createElement('div');wrap.className='answer';const dt=document.createElement('dt');dt.textContent=human(k);const dd=document.createElement('dd');dd.textContent=text(v);wrap.append(dt,dd);box.append(wrap)});$('#detail').showModal()}
    $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter,err=$('#loginError');btn.disabled=true;btn.textContent='Checking…';err.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const body=(r.headers.get('content-type')||'').includes('application/json')?await r.json():{};if(!r.ok)throw Error(body.error||'Could not sign in');$('#password').value='';await load()}catch(x){err.textContent=x.message}finally{btn.disabled=false;btn.textContent='Open dashboard'}});$('#search').oninput=render;$('#filter').onchange=render;$('#close').onclick=()=>$('#detail').close();$('#logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});showLogin()};load().catch(()=>showLogin());
  </script>
</body>
</html>
